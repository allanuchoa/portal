<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allan Workbench</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="view-login" class="view active">
    <div class="login-wrapper">
      <div class="login-card">
        <h1>Allan Workbench</h1>
        <p>Entre com suas credenciais para acessar as ferramentas</p>
        <form id="login-form" class="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Sua senha" required>
          </div>
          <p id="login-error" class="login-error"></p>
          <button type="submit" class="btn-primary">Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <div id="view-launcher" class="view">
    <div class="launcher-wrapper">
      <header class="launcher-header">
        <span class="logo">Allan Workbench</span>
        <div class="user-info">
          <span id="user-email" class="user-email"></span>
          <button id="btn-logout" class="btn-logout">Sair</button>
        </div>
      </header>
      <main class="launcher-content">
        <h2>Ferramentas</h2>
        <div id="launcher-grid"></div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
